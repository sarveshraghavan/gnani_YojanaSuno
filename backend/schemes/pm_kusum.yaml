id: pm_kusum
name: PM-KUSUM solar pump support
version: "2026-11-demo-2"
source_url: "https://pmkusum.mnre.gov.in/"
sources:
  - "https://pmkusum.mnre.gov.in/"
  - "https://pmkusum.mnre.gov.in/pdf/Guidelines%20for%20PM%20KUSUM%20Scheme%20%2822-07-2019%29.pdf"
  - "https://pmkusum.mnre.gov.in/assets/pdf/PM%20KUSUM%20FAQs%20-%20Revised_%20April%20%28Brand%29.pdf"
last_verified: "2026-11-08"
verified: false
benefit: "Support for eligible standalone solar pumps (Component B) and solarisation of existing grid-connected agricultural pumps (Component C)."
required_slots: [state, has_grid_connected_pump, state_application_open, state_requirements_confirmed]
slot_mappings:
  has_grid_connected_pump:
    true: {component: C}
    false: {component: B}
rules:
  - {slot: component, op: in, value: [B, C], source_ref: "MNRE PM-KUSUM Guidelines (22 July 2019), Section 3.II (Component B, p. 8) and Section 3.III (Component C, pp. 12-13); standalone off-grid pumps vs grid-connected pump solarisation"}
  - {slot: state_application_open, op: eq, value: true, source_ref: ""}
  - {slot: state_requirements_confirmed, op: eq, value: true, source_ref: ""}
not_checked:
  - Live state application window, implementing agency notification, and district allocation.
  - "State-specific differences: annual capacity allocations, implementing agency and application process, pump capacity limits or lower state-set PV sizing, farmer contribution or additional state subsidy, and customized state policies."
  - Pump capacity, water source, feeder-level requirements, dark/black-zone rules, micro-irrigation conditions, grid capacity, farmer contribution, and other component-specific technical rules.
next_steps:
  documents: [land_record, pump_and_water_source_details, electricity_connection_details_if_applicable]
  guidance: "State implementing agencies manage applications and may set state-specific requirements. Confirm the component, open application window, contribution, pump capacity, and required records with your State Implementing Agency."
